# Alternative to the Poetry-locked GPU/CPU environment. TorchTPU requires
# Python 3.13, CPU PyTorch, NumPy 2+, and TensorBoard 2.20+; these versions
# intentionally differ from pyproject.toml/poetry.lock.
name: crl-cxr-torchtpu
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.13.18
  - pip
  - libgl
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch==2.15.0+cpu
      - torchvision==0.29.2+cpu
      - torch-tpu==0.2.0
      - numpy==2.5.4
      - matplotlib==3.11.2
      - lightning==2.4.0
      - pytorch-lightning==2.5.0.post0
      - torchmetrics==1.6.1
      - pandas==2.2.3
      - tqdm==4.66.3
      - scikit-learn==1.6.1
      - scikit-image==0.25.1
      - tensorboard==2.21.0
      - jupyter==1.1.1
      - seaborn==0.13.2
      - openpyxl==3.1.5
      - python-dotenv==1.0.1
      - tabulate==0.9.0
      - opencv-python==4.11.0.86
